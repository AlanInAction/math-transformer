[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "corpus",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes: undefined names, unused imports, etc.
    "I",  # import sorting
    "UP", # pyupgrade
]

[tool.ruff.format]
quote-style = "double"